name: Tire Price Scraper

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 10:00 UTC
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.schedule-check.outputs.should_run }}

    steps:
      - name: Check whether this account should run
        id: schedule-check
        shell: bash
        run: |
          DAY_OF_MONTH=$(date -u +%-d)

          # Manual runs should always proceed
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif (( DAY_OF_MONTH >= 15 && DAY_OF_MONTH <= 28 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape Giga and Priority
        run: python scraper/combined_tire_scraper_actions.py

      - name: Scrape all SimpleTire products
        run: node scraper/simpletire-scrape.js --default-gt-radial --format csv > simpletire_raw.csv

      - name: Standardize and combine all results
        run: python scraper/standardize_tire_prices.py

      - name: Upload combined CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-tire-prices-${{ github.run_id }}
          path: tire_prices_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload SimpleTire raw CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpletire-raw-${{ github.run_id }}
          path: simpletire_raw.csv
          if-no-files-found: warn
          retention-days: 30
